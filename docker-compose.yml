services:
  jideo:
    build: .
    image: jideo:local
    env_file: .env
    environment:
      JIDEO_DATA_DIR: /data
    user: "${JIDEO_UID:-1000}:${JIDEO_GID:-1000}"
    ports:
      - "${JIDEO_BIND:-127.0.0.1}:${JIDEO_PORT:-4545}:4545"
    volumes:
      - ./data:/data
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    restart: unless-stopped
